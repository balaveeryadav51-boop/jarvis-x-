name: Build JARVIS X APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir project
          unzip "jarvis-x (1).zip" -d project
          find project -name settings.gradle.kts -o -name settings.gradle
          find project -name build.gradle.kts -o -name build.gradle

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Android APK
        working-directory: project
        run: |
          PROJECT_DIR="$(find . -name settings.gradle.kts -o -name settings.gradle | head -n 1 | xargs dirname)"
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-X-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
